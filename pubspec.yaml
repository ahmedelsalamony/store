name: store
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  #UI and animation  
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.3
  flutter_screenutil: ^5.9.3
  animate_do: ^3.3.4
  shimmer: ^3.0.0
  #firebase
  firebase_core: ^3.8.0
  #Utils
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.4
  #localization
  flutter_localizations:
    sdk: flutter
  #bloc
  freezed_annotation: ^2.4.4  
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  #API
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1
  fluttertoast: ^8.2.10
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_zoom_drawer: ^3.2.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/customer/user.png
    - assets/images/admin/drawer_image.png
    - assets/images/admin/categories_drawer.png
    - assets/images/admin/users_drawer.png
    - assets/images/admin/products_drawer.png
    - assets/lang/ar.json
    - assets/lang/en.json
    - lib/.env.dev
    - lib/.env.production
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400      


  
  

 
